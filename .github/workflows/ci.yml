name: Full CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: full-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and committed Pages output
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Classify docs output scope
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docs_drift=true
          baseline_sha=""
          page=1
          per_page=100
          runs_file="$(mktemp)"
          trap 'rm -f "${runs_file}"' EXIT

          while [[ -z "${baseline_sha}" ]]; do
            if ! gh api --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -f branch=main \
              -f event=push \
              -f status=success \
              -F per_page="${per_page}" \
              -F page="${page}" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" > "${runs_file}"; then
              echo "::warning::Unable to query successful Full CI runs; requiring the docs drift check."
              break
            fi

            if ! jq -e 'type == "object" and (.workflow_runs | type == "array")' "${runs_file}" > /dev/null; then
              echo "::warning::Invalid workflow-runs response; requiring the docs drift check."
              break
            fi

            run_count="$(jq '.workflow_runs | length' "${runs_file}")"
            mapfile -t candidate_shas < <(
              jq -r '.workflow_runs[]
                | select(.name == "Full CI"
                    and .event == "push"
                    and .head_branch == "main"
                    and .conclusion == "success")
                | .head_sha // empty' "${runs_file}"
            )

            for candidate_sha in "${candidate_shas[@]}"; do
              if [[ ! "${candidate_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || ! git cat-file -e "${candidate_sha}^{commit}"; then
                continue
              fi
              if git merge-base --is-ancestor "${candidate_sha}" "${GITHUB_SHA}"; then
                baseline_sha="${candidate_sha}"
                break
              fi
            done

            if (( run_count < per_page )); then
              break
            fi
            ((page += 1))
          done

          if [[ -z "${baseline_sha}" ]]; then
            echo "::warning::No successful ancestor Full CI run found; requiring the docs drift check."
          elif changed_files="$(git diff --name-only "${baseline_sha}" "${GITHUB_SHA}")"; then
            if ! grep -Eq '^(src/|public/|locales/|docs/|index\.html$|package(-lock)?\.json$|vite\.config\.(js|mjs|ts)$)' <<<"${changed_files}"; then
              docs_drift=false
            fi
          else
            echo "::warning::Unable to compare the Full CI baseline; requiring the docs drift check."
          fi

          echo "docs_drift=${docs_drift}" >> "${GITHUB_OUTPUT}"
          echo "Committed docs drift check required: ${docs_drift}"

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Verify committed docs output has no drift
        if: steps.scope.outputs.docs_drift == 'true'
        shell: bash
        run: |
          set -euo pipefail
          drift="$(git status --porcelain --untracked-files=all -- docs)"
          if [[ -n "${drift}" ]]; then
            echo "::error::docs/ does not match the production build for this candidate."
            printf '%s\n' "${drift}"
            exit 1
          fi
          test -f docs/index.html
